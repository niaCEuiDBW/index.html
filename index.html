<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Планер Batch</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 20px;
            margin: 0;
            padding-bottom: 80px; /* Отступ для кнопки ТГ */
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--tg-theme-hint-color, #ccc);
            border-radius: 8px;
            background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
            color: var(--tg-theme-text-color, #000000);
            box-sizing: border-box;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <h2>Твои параметры</h2>
    
    <div class="form-group">
        <label for="gender">Пол:</label>
        <select id="gender">
            <option value="male">Мужской</option>
            <option value="female">Женский</option>
        </select>
    </div>

    <div class="form-group">
        <label for="age">Возраст (лет):</label>
        <input type="number" id="age" placeholder="Например: 25">
    </div>

    <div class="form-group">
        <label for="weight">Вес (кг):</label>
        <input type="number" id="weight" placeholder="Например: 70">
    </div>

    <div class="form-group">
        <label for="height">Рост (см):</label>
        <input type="number" id="height" placeholder="Например: 175">
    </div>

    <div class="form-group">
        <label for="activity">Уровень активности:</label>
        <select id="activity">
            <option value="1.2">Сидячий образ (почти нет активности)</option>
            <option value="1.375">Легкая активность (тренировки 1-3 раза в неделю)</option>
            <option value="1.55">Средняя активность (тренировки 3-5 раз в неделю)</option>
            <option value="1.725">Высокая активность (тренировки каждый день)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="goal">Твоя цель:</label>
        <select id="goal">
            <option value="lose">Похудеть (-20%)</option>
            <option value="keep">Поддерживать вес</option>
            <option value="gain">Набрать массу (+15%)</option>
        </select>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); 

        tg.MainButton.textColor = '#ffffff';
        tg.MainButton.color = '#2481cc';
        tg.MainButton.setText('РАССЧИТАТЬ НОРМУ');
        tg.MainButton.show();

        Telegram.WebApp.onEvent('mainButtonClicked', function() {
            let gender = document.getElementById('gender').value;
            let age = document.getElementById('age').value;
            let weight = document.getElementById('weight').value;
            let height = document.getElementById('height').value;
            let activity = document.getElementById('activity').value;
            let goal = document.getElementById('goal').value;

            if (!age || !weight || !height) {
                tg.showAlert("Пожалуйста, заполни возраст, вес и рост!");
                return;
            }

            let data = {
                action: 'calculate',
                gender: gender,
                age: age,
                weight: weight,
                height: height,
                activity: activity,
                goal: goal
            };

            tg.sendData(JSON.stringify(data)); 
        });
    </script>
</body>
</html>
