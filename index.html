<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Планер Batch</title>
    <!-- Тот самый скрипт Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Делаем так, чтобы цвета сами подстраивались под темную/светлую тему ТГ */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 20px;
            margin: 0;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--tg-theme-hint-color, #ccc);
            border-radius: 8px;
            background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
            color: var(--tg-theme-text-color, #000000);
            box-sizing: border-box;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <h2>Параметры</h2>
    
    <div class="form-group">
        <label for="weight">Вес (кг):</label>
        <input type="number" id="weight" placeholder="Например: 70">
    </div>

    <div class="form-group">
        <label for="height">Рост (см):</label>
        <input type="number" id="height" placeholder="Например: 175">
    </div>

    <div class="form-group">
        <label for="goal">Твоя цель:</label>
        <select id="goal">
            <option value="lose">Похудеть</option>
            <option value="keep">Поддерживать вес</option>
            <option value="gain">Набрать массу</option>
        </select>
    </div>

    <script>
        // Инициализируем Web App
        let tg = window.Telegram.WebApp;
        
        // Расширяем приложение на всю высоту экрана
        tg.expand(); 

        // Включаем главную кнопку Telegram (внизу экрана)
        tg.MainButton.textColor = '#ffffff';
        tg.MainButton.color = '#2481cc';
        tg.MainButton.setText('РАССЧИТАТЬ НОРМУ');
        tg.MainButton.show();

        // Что происходит при нажатии на Главную кнопку
        Telegram.WebApp.onEvent('mainButtonClicked', function() {
            let weight = document.getElementById('weight').value;
            let height = document.getElementById('height').value;
            let goal = document.getElementById('goal').value;

            if (!weight || !height) {
                tg.showAlert("Пожалуйста, заполни вес и рост!");
                return;
            }

            // Упаковываем данные
            let data = {
                action: 'calculate',
                weight: weight,
                height: height,
                goal: goal
            };

            // Отправляем данные боту (закрывая приложение)
            tg.sendData(JSON.stringify(data)); 
        });
    </script>
</body>
</html>
